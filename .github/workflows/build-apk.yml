name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :sample-app:assembleDebug --stacktrace --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidflow-debug-apk
          path: sample-app/build/outputs/apk/debug/*.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: LiquidFlow UI demo APK
          body: Debug APK built by CI from the sample application (start screen, Android stage, demo).
          files: sample-app/build/outputs/apk/debug/*.apk
